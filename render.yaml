services:
  # 1. Backend (FastAPI Web Service)
  - type: web
    name: 3core-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: B2_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_BUCKET_NAME
        value: 3core-storage
      - key: B2_REGION
        value: us-east-005
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://3core-portal.onrender.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SEED_PM_PASSWORD
        sync: false

  # 2. Frontend (React Static Site)
  # We use 'runtime: static' within a web service or 'staticSites'
  # If 'staticSites' failed previously, we use 'type: web' + 'runtime: static'
  - type: web
    name: 3core-portal
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://3core-api.onrender.com
